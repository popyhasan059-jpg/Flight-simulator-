name: Build Skyline Flight Simulator

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"

      - name: Extract ZIP
        run: |
          unzip -q SkylineFlightSim-Android.zip -d source
          test -f source/SkylineFlightSim/gradlew

      - name: Build APK
        working-directory: source/SkylineFlightSim
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Flight-Simulator-APK
          path: source/SkylineFlightSim/app/build/outputs/apk/debug/*.apk
